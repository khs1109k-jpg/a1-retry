name: oracle-a1-retry
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency: { group: a1, cancel-in-progress: false }
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: OCI CLI 설치
        run: pip install --quiet oci-cli
      - name: 인증 설정
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUB: ${{ secrets.SSH_PUB }}
        run: |
          mkdir -p ~/.oci ~/.ssh
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem && chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=ap-tokyo-1\nkey_file=~/.oci/key.pem\n' "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" > ~/.oci/config
          chmod 600 ~/.oci/config
          printf '%s\n' "$SSH_PUB" > ~/.ssh/id_rsa.pub
      - name: A1 생성 시도
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MAX_ROUNDS: "3"
          WAIT: "50"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: bash a1-retry.sh
      - name: 로그
        if: always()
        run: cat ~/a1-retry.log || true
